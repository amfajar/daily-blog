name: Deploy to Pages Branch

on:
  # Trigger this "workflow" whenever you push to the `master` branch
  # If you use a different branch name, please replace `master` with your branch name as needed.
  push:
    branches: [ master ]
  # Allows you to manually trigger this "workflow" from the GitHub Actions tab
  workflow_dispatch:

# Need write permissions to push to the pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      
      # ─── New Step: Clone your separate Vault repository ───────────────────
      # Replace 'YOUR_USERNAME/YOUR_VAULT_REPO' with your real vault repo name.
      # Create a GitHub secret named 'VAULT_TOKEN' with a Personal Access Token (PAT).
      - name: Checkout Vault Repo
        uses: actions/checkout@v4
        with:
          repository: YOUR_USERNAME/YOUR_VAULT_REPO
          token: ${{ secrets.VAULT_TOKEN }}
          path: vault
      # ──────────────────────────────────────────────────────────────────────

      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site
        run: pnpm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages # Deploy to the pages branch
          folder: dist # Astro default build output directory
          clean: true # Clean old files in the target branch
